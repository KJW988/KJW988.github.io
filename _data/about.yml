  about_heading: From understanding to action.
  about:
    - 'I research Embodied AI and Robot Learning, primarily using robotic arms and quadruped robots. Drawing on research experience connecting perception, reasoning, and action, I explore the question: “How can learned models be used efficiently and reliably in real-world environments?”'
    - My strengths lie in formulating concrete hypotheses and validating ideas through implementation and experiments. Rather than focusing solely on performance gains, I examine why improvements occur and under what conditions limitations emerge, working to understand and improve model behavior.
    - I believe failure can become a source of learning when we analyze its causes and reflect on the process. In collaboration, I therefore value sharing not only outcomes but also the methods we have tried, the challenges we have encountered, and the analyses and reflections that follow. Over the past two years of research, discussions with colleagues from different areas of expertise have shown me the value of collaboration. <strong>I now seek to work in industry, openly exchanging ideas with colleagues and working together to find new solutions to problems with no predetermined answers.</strong>
