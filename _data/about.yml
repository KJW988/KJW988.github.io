    - 국민대학교 Machine Intelligence Lab.에서 이재구 교수님의 지도를 받으며 Embodied AI와 Robot Learning을 연구하고 있습니다. 경제학과 소프트웨어를 함께 공부했고, 현재는 시각·언어·행동을 연결하는 학습 기반 로봇 정책에 집중하고 있습니다.
    - '관심의 중심에는 “학습한 모델을 실제 환경에서 어떻게 효율적이고 안정적으로 사용할 수 있을까?”라는 질문이 있습니다. 생성형 행동 모델의 추론 비용을 줄이고, 언어와 시각 정보를 제어에 반영하며, 모델의 실패 조건을 분석하는 연구를 해왔습니다.'
    - UC Irvine 방문연구에서는 온디바이스 VLA 추론 가속과 효율화를 연구했습니다. 현대자동차 산학협력에서는 차량 도메인 LLM을 활용한 검증 업무 효율화 연구에 참여했습니다.
