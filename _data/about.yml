  grad: 'Expected graduation: February 2027'
  portrait_alt: Profile photo of Jiwon Kim
  projects_url: /projects/en/
  about_heading: From understanding to action.
  about:
    - 'My research focuses on embodied AI and robot learning, primarily with robotic arms and quadruped robots. Through work spanning perception, reasoning, and action, I explore a central question: “How can learned models be used efficiently and reliably in real-world environments?”'
    - My strengths lie in turning research questions into testable hypotheses and validating ideas through implementation and experiments. I look beyond performance gains to understand why a method works and where it reaches its limits, using those insights to improve model behavior.
    - I believe failure becomes a learning opportunity when we examine its causes and reflect on the process. In collaboration, I value sharing not only results but also the approaches we tried, the challenges we encountered, and what we learned from them. Over the past two years, discussions with colleagues from different areas of expertise have deepened my appreciation for collaborative research.
  about_closing: I hope to bring this approach to industry, exchanging ideas openly with colleagues and developing new solutions to problems without predefined answers.
