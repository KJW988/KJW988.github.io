  about_heading: From understanding to action.
  about:
    - I am a master’s student at the Machine Intelligence Lab., Kookmin University, advised by Prof. Jaekoo Lee. My background spans economics and computer science, and my research focuses on learning-based robot policies that connect vision, language, and action.
    - 'My work is driven by a question: how can learned models be used efficiently and reliably in the physical world? I have studied inference acceleration for generative robot policies, language-conditioned visual representations for control, and failure conditions of vision-language-action models.'
    - During my research visit to UC Irvine, I worked on efficient VLA inference for on-device deployment. I also participated in a university–industry collaboration with Hyundai Motor Company on using domain-specific LLMs to improve verification workflows.
