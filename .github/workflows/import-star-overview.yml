name: Import author-verified STAR overview
on:
  push:
    branches: [main]
    paths:
      - tools/site/import_star_overview.py
      - .github/workflows/import-star-overview.yml
permissions:
  contents: write
concurrency:
  group: import-star-overview
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare one-time renderer
        run: python3 -m pip install PyMuPDF==1.26.7 gdown==5.2.0
      - name: Import verified drawing, excluding manuscript and fonts
        run: python3 tools/site/import_star_overview.py
      - name: Save self-contained image for offline future builds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/site/media/star-overview-*.svg tools/site/media/star-overview.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: preserve author-verified STAR overview as self-contained SVG'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
