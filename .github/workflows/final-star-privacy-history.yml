name: Finalize STAR source-history privacy cleanup
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  sanitize_history:
    if: github.event.head_commit.message == 'Prepare final STAR history cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rewrite public main from fully sanitized source tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] || [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Abort: public main changed during privacy cleanup."
            exit 1
          fi
          python3 tools/site/verify_star_privacy.py --source .
          if [ -n "$(git ls-remote --tags origin)" ]; then
            echo "Abort: unexpected public tag exists."
            exit 1
          fi
          git checkout --orphan sanitized-public-final
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Privacy-clean STAR public history (prior DAG archived privately)"
          git push --force-with-lease=refs/heads/main:"$GITHUB_SHA" origin HEAD:refs/heads/main
          echo "Public main now references only metadata-safe source history." >> "$GITHUB_STEP_SUMMARY"
