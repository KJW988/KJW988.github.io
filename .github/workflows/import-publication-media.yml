name: Import approved publication media
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-publication-media.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-approved-publication-media
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and validate the exact author-approved render bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, http.cookiejar, io, json, os, pathlib, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          file_id = '1McpqgBII6zRjOMdu7fZWhBpSPixfWXR5'
          expected_zip = 'dc43e16209d829bcae0779a258de7e807ac36168f265a3293d18f47b0b9f28bd'
          expected = {
              'navila-overview.png': '011285f5ea67e487bd276b072c0d85ad5b2c8eca4841cd7ba70cded18b707e6e',
              'navila-poster.svg': '206ca56918d18327de4de5f85d9a5da344e03b953f93badfa4673b2ef8a59bba',
              'star-overview.svg': 'd9f24a76288c69a5397c325c9b03fcb35652c67e6be1a1de379168949e8259df',
              'velocity-overview.png': '531e2dfe2993ac2a1858f4a423dce3c7b1c97de6e1621444bdcaa9952b3afeba',
              'velocity-poster.svg': 'fc4d1f62dc08d790ada8d69a0216b1e95a1f0d8cd02337d548b562db0848da83',
          }
          urls = [
              f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
              f'https://drive.google.com/uc?export=download&id={file_id}&confirm=t',
          ]
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          raw = None
          failures = []
          for url in urls:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with opener.open(request, timeout=60) as response:
                      body = response.read(6_000_001)
                  if len(body) > 6_000_000:
                      raise ValueError('Transfer exceeds the approved bundle size')
                  if not zipfile.is_zipfile(io.BytesIO(body)):
                      raise ValueError('Drive did not return the ZIP; check link access')
                  if hashlib.sha256(body).hexdigest() != expected_zip:
                      raise ValueError('ZIP does not match the approved transfer bundle')
                  raw = body
                  break
              except Exception as error:
                  failures.append(str(error))
          if raw is None:
              raise SystemExit('Transfer failed: ' + '; '.join(failures))
          media = pathlib.Path('tools/site/media')
          media.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              if len(archive.infolist()) != len(expected) or set(archive.namelist()) != set(expected):
                  raise SystemExit('Unexpected file in the approved render-only bundle')
              if sum(entry.file_size for entry in archive.infolist()) > 12_000_000:
                  raise SystemExit('Unpacked media exceeds the size limit')
              for name, digest in expected.items():
                  content = archive.read(name)
                  if hashlib.sha256(content).hexdigest() != digest:
                      raise SystemExit('Asset hash mismatch: ' + name)
                  if name.endswith('.svg'):
                      if any(s in content for s in (b'<script', b'<text', b'@font-face', b'file://')):
                          raise SystemExit('Unexpected active or font content: ' + name)
                      root = ET.fromstring(content)
                      for element in root.iter():
                          for key, value in element.attrib.items():
                              if key.endswith('href') and not value.startswith('#'):
                                  if not value.startswith(('data:image/png;base64,', 'data:image/jpeg;base64,')):
                                      raise SystemExit('External resource in SVG: ' + name)
                                  image = base64.b64decode(value.split(',', 1)[1])
                                  if not image.startswith((b'\x89PNG\r\n\x1a\n', b'\xff\xd8\xff')):
                                      raise SystemExit('Invalid embedded image: ' + name)
                  print(name, len(content), digest)
          # The existing publication build accepts this exact bundle and validates
          # each file again before writing the rendered-only public assets.
          (media / 'publication-rendered-media.zip').write_bytes(raw)
          report = {'zip_sha256': expected_zip, 'verified_assets': expected,
                    'star_manuscript_included': False, 'original_pdfs_or_fonts_included': False,
                    'external_svg_resources': False}
          pathlib.Path('/tmp/publication-media-import.json').write_text(json.dumps(report, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Verified the exact author-approved ZIP and all five rendered media files.\n\n')
              summary.write('No manuscript PDFs, poster PDFs, fonts, or STAR poster were imported.\n')
          PY
      - name: Store the render bundle in GitHub, independent of Google Drive
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/site/media/publication-rendered-media.zip
          if git diff --cached --quiet; then
            echo 'Approved media are already stored in the repository.'
          else
            git commit -m 'Add verified author figures and rendered IEIE/IPIU poster bundle'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save import verification
        uses: actions/upload-artifact@v4
        with:
          name: publication-media-import-verification
          path: /tmp/publication-media-import.json
          retention-days: 7
