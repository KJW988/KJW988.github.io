name: Research public site check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/research/verify_live.py'
      - '.github/workflows/research-live-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser testing tools
        run: |
          python3 -m pip install playwright==1.61.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check live public pages
        run: python3 tools/research/verify_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-research-site-report
          path: live-check-results/
          retention-days: 14
