name: Research public site check
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Jekyll site to Pages"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: research-live-check
  cancel-in-progress: true
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Install browser testing tools
        run: |
          python3 -m pip install playwright==1.61.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check shared navigation, editorial copy, motion, contact and retirement
        run: |
          python3 tools/site/verify_marker_lean.py
          python3 tools/site/verify_interaction.py
          python3 tools/site/verify_polish.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-research-site-report
          path: live-check-results/
          retention-days: 14
