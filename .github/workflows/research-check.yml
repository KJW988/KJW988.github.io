name: Research pages validation
on:
  pull_request:
    paths:
      - 'tools/research/**'
      - '.github/workflows/research-check.yml'
      - '.github/workflows/jekyll.yml'
  push:
    branches: ['feat/bilingual-research-projects']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate
        run: |
          python3 tools/research/publish.py
          python3 tools/research/check.py
          node --check tools/research/site.js
      - uses: actions/upload-artifact@v4
        with:
          name: bilingual-research-pages
          path: projects/
          retention-days: 14
