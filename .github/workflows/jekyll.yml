# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: npm build
        run: npm install && npm run build
      - name: Build and validate research pages
        run: |
          python3 tools/research/publish.py
          python3 tools/research/check.py
          node --check tools/research/site.js
          node --check assets/js/about.js
      - name: Install rendered-only seminar viewer when its bundle is present
        run: |
          python3 -m py_compile tools/seminars/install.py tools/seminars/verify.py
          python3 tools/seminars/install.py
          if [ -f seminars/viewer.js ]; then node --check seminars/viewer.js; fi
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Validate About home and unpublished post
        run: python3 tools/about/check.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
